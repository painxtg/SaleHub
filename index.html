<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SaleTrack</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      background: #111821;
      border: 1px solid #202b38;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 50px rgba(0,0,0,.35);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .logo span {
      color: #4ade80;
    }

    .subtitle {
      text-align: center;
      color: #8b98a8;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #aab5c2;
    }

    input {
      width: 100%;
      border: 1px solid #293544;
      background: #0b1118;
      color: #fff;
      border-radius: 11px;
      padding: 13px 14px;
      outline: none;
    }

    input:focus {
      border-color: #4ade80;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      background: #4ade80;
      color: #07120b;
      padding: 13px;
      border-radius: 11px;
      font-weight: 700;
      margin-top: 5px;
    }

    .primary-btn:hover {
      opacity: .9;
    }

    /* APP */

    #appPage {
      min-height: 100vh;
      padding-bottom: 50px;
    }

    .container {
      width: min(100% - 30px, 900px);
      margin: auto;
    }

    .topbar {
      padding: 18px 0;
      border-bottom: 1px solid #1c2631;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    .brand span {
      color: #4ade80;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #aab5c2;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    .status.offline .status-dot {
      background: #ef4444;
    }

    .logout-btn {
      border: 1px solid #293544;
      background: #111821;
      color: #ddd;
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 12px;
    }

    /* DASHBOARD */

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin: 20px 0;
    }

    .card {
      background: #111821;
      border: 1px solid #202b38;
      border-radius: 15px;
      padding: 16px;
    }

    .card-label {
      color: #8491a1;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 21px;
      font-weight: 800;
      word-break: break-word;
    }

    /* ACTIONS */

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .action-btn {
      border: 1px solid #293544;
      background: #111821;
      color: #fff;
      padding: 11px 15px;
      border-radius: 10px;
      font-weight: 600;
    }

    .action-btn.add {
      background: #4ade80;
      color: #07120b;
      border-color: #4ade80;
    }

    .action-btn.danger {
      color: #ff7676;
    }

    .action-btn:hover {
      opacity: .88;
    }

    /* SALES LIST */

    .sales-box {
      background: #111821;
      border: 1px solid #202b38;
      border-radius: 17px;
      overflow: hidden;
    }

    .sales-header {
      padding: 15px 17px;
      border-bottom: 1px solid #202b38;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sales-title {
      font-weight: 700;
    }

    .sales-count {
      font-size: 12px;
      color: #7f8b99;
    }

    #salesList {
      padding: 10px;
    }

    .sale-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px;
      border-bottom: 1px solid #1c2530;
    }

    .sale-row:last-child {
      border-bottom: 0;
    }

    .sale-number {
      width: 30px;
      text-align: center;
      color: #697686;
      font-size: 12px;
      flex-shrink: 0;
    }

    .sale-input {
      flex: 1;
      min-width: 0;
      padding: 11px 12px;
      font-size: 16px;
    }

    .delete-btn {
      width: 38px;
      height: 38px;
      border: 1px solid #3b2525;
      background: #1c1313;
      color: #ff6b6b;
      border-radius: 9px;
      font-size: 17px;
      flex-shrink: 0;
    }

    .pending {
      opacity: .65;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      color: #667383;
      font-size: 14px;
    }

    /* MODAL */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      width: 100%;
      max-width: 360px;
      background: #111821;
      border: 1px solid #293544;
      border-radius: 17px;
      padding: 23px;
    }

    .modal h3 {
      margin-bottom: 9px;
    }

    .modal p {
      color: #8d99a7;
      font-size: 14px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      padding: 11px;
      border-radius: 9px;
      border: 1px solid #293544;
      background: #18212b;
      color: #fff;
    }

    .modal-actions .confirm {
      background: #ef4444;
      border-color: #ef4444;
    }

    /* TOAST */

    #toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(20px);
      background: #17202a;
      border: 1px solid #293544;
      color: #fff;
      padding: 11px 15px;
      border-radius: 10px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: .25s;
      z-index: 200;
      max-width: calc(100% - 30px);
      text-align: center;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* UNDO */

    #undoBar {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      background: #17202a;
      border: 1px solid #293544;
      border-radius: 12px;
      padding: 10px 12px;
      display: none;
      align-items: center;
      gap: 13px;
      z-index: 150;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    #undoBar.show {
      display: flex;
    }

    #undoBtn {
      border: 0;
      background: transparent;
      color: #4ade80;
      font-weight: 700;
    }

    @media(max-width: 700px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width: 480px) {
      .container {
        width: min(100% - 20px, 900px);
      }

      .topbar-inner {
        align-items: flex-start;
      }

      .user-area {
        flex-direction: column;
        align-items: flex-end;
      }

      .dashboard {
        gap: 8px;
      }

      .card {
        padding: 13px;
      }

      .card-value {
        font-size: 18px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .action-btn {
        width: 100%;
      }

      .action-btn.add {
        grid-column: span 2;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN PAGE -->
  <section id="loginPage">

    <div class="login-box">

      <div class="logo">
        Sale<span>Track</span>
      </div>

      <div class="subtitle">
        Simple and fast sales tracker
      </div>

      <form id="loginForm">

        <div class="form-group">
          <label>Email</label>
          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >
        </div>

        <button class="primary-btn" type="submit">
          Login
        </button>

      </form>

    </div>

  </section>


  <!-- APP PAGE -->
  <section id="appPage" class="hidden">

    <header class="topbar">
      <div class="container topbar-inner">

        <div class="brand">
          Sale<span>Track</span>
        </div>

        <div class="user-area">

          <div id="connectionStatus" class="status">
            <span class="status-dot"></span>
            <span id="statusText">Online</span>
          </div>

          <button id="logoutBtn" class="logout-btn">
            Logout
          </button>

        </div>

      </div>
    </header>


    <main class="container">

      <!-- DASHBOARD -->
      <div class="dashboard">

        <div class="card">
          <div class="card-label">Add Count</div>
          <div id="countValue" class="card-value">0</div>
        </div>

        <div class="card">
          <div class="card-label">Total Sales</div>
          <div id="totalValue" class="card-value">0</div>
        </div>

        <div class="card">
          <div class="card-label">Today Sales</div>
          <div id="todayValue" class="card-value">0</div>
        </div>

        <div class="card">
          <div class="card-label">Last Sale</div>
          <div id="lastSaleValue" class="card-value">—</div>
        </div>

      </div>


      <!-- ACTIONS -->
      <div class="actions">

        <button id="addBtn" class="action-btn add">
          ＋ Add Sale
        </button>

        <button id="exportBtn" class="action-btn">
          📤 Export CSV
        </button>

        <button id="resetBtn" class="action-btn danger">
          🗑️ Reset All
        </button>

      </div>


      <!-- SALES -->
      <div class="sales-box">

        <div class="sales-header">

          <div class="sales-title">
            Sales
          </div>

          <div id="salesCountText" class="sales-count">
            0 entries
          </div>

        </div>

        <div id="salesList">

          <div class="empty">
            No sales yet.<br>
            Click "Add Sale" to begin.
          </div>

        </div>

      </div>

    </main>

  </section>


  <!-- CONFIRM MODAL -->
  <div id="modalOverlay" class="modal-overlay hidden">

    <div class="modal">

      <h3 id="modalTitle">
        Confirm
      </h3>

      <p id="modalMessage">
        Are you sure?
      </p>

      <div class="modal-actions">

        <button id="modalCancel">
          No
        </button>

        <button id="modalConfirm" class="confirm">
          Yes
        </button>

      </div>

    </div>

  </div>


  <!-- TOAST -->
  <div id="toast"></div>


  <!-- UNDO BAR -->
  <div id="undoBar">

    <span id="undoText">
      Sale deleted
    </span>

    <button id="undoBtn">
      Undo
    </button>

  </div>


<script>
/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://eavqyzgamuelwyplhqjf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_OSypObpmAQMHjMZrct7QNQ_AtrYXY8Z";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let sales = [];

let pendingDeletes = [];

let undoData = null;

let undoTimer = null;

let modalAction = null;

const saveTimers = new Map();


/* =========================================================
   ELEMENTS
========================================================= */

const loginPage =
  document.getElementById("loginPage");

const appPage =
  document.getElementById("appPage");

const loginForm =
  document.getElementById("loginForm");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const addBtn =
  document.getElementById("addBtn");

const exportBtn =
  document.getElementById("exportBtn");

const resetBtn =
  document.getElementById("resetBtn");

const logoutBtn =
  document.getElementById("logoutBtn");

const salesList =
  document.getElementById("salesList");

const countValue =
  document.getElementById("countValue");

const totalValue =
  document.getElementById("totalValue");

const todayValue =
  document.getElementById("todayValue");

const lastSaleValue =
  document.getElementById("lastSaleValue");

const salesCountText =
  document.getElementById("salesCountText");

const connectionStatus =
  document.getElementById("connectionStatus");

const statusText =
  document.getElementById("statusText");

const modalOverlay =
  document.getElementById("modalOverlay");

const modalTitle =
  document.getElementById("modalTitle");

const modalMessage =
  document.getElementById("modalMessage");

const modalCancel =
  document.getElementById("modalCancel");

const modalConfirm =
  document.getElementById("modalConfirm");

const toast =
  document.getElementById("toast");

const undoBar =
  document.getElementById("undoBar");

const undoText =
  document.getElementById("undoText");

const undoBtn =
  document.getElementById("undoBtn");


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener("submit", async (e) => {

  e.preventDefault();

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;

  if (!email || !password) {
    showToast("Enter email and password.");
    return;
  }

  const button =
    loginForm.querySelector("button");

  button.disabled = true;
  button.textContent = "Logging in...";

  try {

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      throw error;
    }

    currentUser = data.user;

    showApp();

    await loadSales();

  } catch (error) {

    console.error(error);

    showToast(
      error.message || "Login failed."
    );

  } finally {

    button.disabled = false;
    button.textContent = "Login";

  }

});


/* =========================================================
   AUTH CHECK
========================================================= */

async function checkAuth() {

  const {
    data: {
      session
    }
  } = await supabaseClient.auth.getSession();

  if (session && session.user) {

    currentUser =
      session.user;

    showApp();

    await loadSales();

  } else {

    showLogin();

  }

}


supabaseClient.auth.onAuthStateChange(
  async (_event, session) => {

    if (session && session.user) {

      currentUser =
        session.user;

      showApp();

    } else {

      currentUser = null;

      sales = [];

      showLogin();

    }

  }
);


/* =========================================================
   PAGE SWITCH
========================================================= */

function showLogin() {

  loginPage.classList.remove("hidden");

  appPage.classList.add("hidden");

}


function showApp() {

  loginPage.classList.add("hidden");

  appPage.classList.remove("hidden");

}


/* =========================================================
   LOAD SALES
========================================================= */

async function loadSales() {

  if (!currentUser) return;

  setOnlineStatus(
    navigator.onLine
  );

  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("sales")
      .select("id, amount, created_at, user_id")
      .eq("user_id", currentUser.id)
      .order("created_at", {
        ascending: true
      });

    if (error) {
      throw error;
    }

    sales = data || [];

    renderSales();

    setOnlineStatus(true);

  } catch (error) {

    console.error(error);

    setOnlineStatus(false);

    showToast(
      "Could not load sales. Check your connection."
    );

  }

}


/* =========================================================
   ADD SALE
========================================================= */

addBtn.addEventListener("click", async () => {

  if (!currentUser) return;

  /*
    Optimistic UI:
    Row appears immediately without waiting
    for Supabase.
  */

  const tempId =
    "temp-" + Date.now() + "-" + Math.random();

  const newSale = {

    id: tempId,

    amount: 0,

    created_at:
      new Date().toISOString(),

    user_id:
      currentUser.id,

    pending: true

  };

  sales.push(newSale);

  renderSales();

  requestAnimationFrame(() => {

    const input =
      document.querySelector(
        `[data-id="${tempId}"]`
      );

    if (input) {

      input.focus();

      input.select();

    }

  });

  /*
    Save empty sale in background.
  */

  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("sales")
      .insert({
        amount: 0,
        user_id: currentUser.id
      })
      .select()
      .single();

    if (error) {
      throw error;
    }

    const index =
      sales.findIndex(
        item => item.id === tempId
      );

    if (index !== -1) {

      const currentAmount =
        sales[index].amount;

      sales[index] = {
        ...data,
        amount: currentAmount
      };

      sales[index].pending = false;

      renderSales();

      /*
        If user typed while insert was happening,
        save that value.
      */

      if (Number(currentAmount) !== 0) {

        await updateSale(
          data.id,
          currentAmount
        );

      }

    }

    setOnlineStatus(true);

  } catch (error) {

    console.error(error);

    sales =
      sales.filter(
        item => item.id !== tempId
      );

    renderSales();

    setOnlineStatus(false);

    showToast(
      "Could not create sale."
    );

  }

});


/* =========================================================
   RENDER SALES
========================================================= */

function renderSales() {

  if (!sales.length) {

    salesList.innerHTML = `
      <div class="empty">
        No sales yet.<br>
        Click "Add Sale" to begin.
      </div>
    `;

    updateDashboard();

    return;
  }

  salesList.innerHTML =
    sales.map((sale, index) => {

      const amount =
        Number(sale.amount || 0);

      return `

        <div class="sale-row
          ${sale.pending ? "pending" : ""}
        ">

          <div class="sale-number">
            ${index + 1}
          </div>

          <input
            class="sale-input"
            data-id="${sale.id}"
            type="number"
            inputmode="decimal"
            step="0.01"
            min="0"
            value="${amount}"
            placeholder="Enter amount"
          >

          <button
            class="delete-btn"
            data-delete="${sale.id}"
            title="Delete"
          >
            ×
          </button>

        </div>

      `;

    }).join("");

  updateDashboard();

}


/* =========================================================
   INPUT EVENTS
========================================================= */

salesList.addEventListener(
  "input",
  (e) => {

    if (
      !e.target.classList.contains(
        "sale-input"
      )
    ) return;

    const id =
      e.target.dataset.id;

    const value =
      parseFloat(e.target.value);

    const sale =
      sales.find(
        item => String(item.id) === String(id)
      );

    if (!sale) return;

    sale.amount =
      Number.isFinite(value)
        ? value
        : 0;

    /*
      Update dashboard instantly.
    */

    updateDashboard();

    /*
      Don't send a request on every keypress.
      Wait 500ms.
    */

    clearTimeout(
      saveTimers.get(id)
    );

    const timer =
      setTimeout(() => {

        saveSaleValue(
          id,
          sale.amount
        );

      }, 500);

    saveTimers.set(id, timer);

  }
);


/* =========================================================
   BLUR = SAVE IMMEDIATELY
========================================================= */

salesList.addEventListener(
  "focusout",
  (e) => {

    if (
      !e.target.classList.contains(
        "sale-input"
      )
    ) return;

    const id =
      e.target.dataset.id;

    clearTimeout(
      saveTimers.get(id)
    );

    const sale =
      sales.find(
        item => String(item.id) === String(id)
      );

    if (!sale) return;

    saveSaleValue(
      id,
      sale.amount
    );

  }
);


/* =========================================================
   DELETE BUTTON
========================================================= */

salesList.addEventListener(
  "click",
  (e) => {

    const button =
      e.target.closest(
        "[data-delete]"
      );

    if (!button) return;

    const id =
      button.dataset.delete;

    openConfirm(
      "Delete Sale",
      "Are you sure you want to delete this sale?",
      () => deleteSale(id)
    );

  }
);


/* =========================================================
   SAVE SALE
========================================================= */

async function saveSaleValue(
  id,
  amount
) {

  /*
    Temporary ID = not inserted yet.
    Add handler already handles it.
  */

  if (String(id).startsWith("temp-")) {
    return;
  }

  try {

    const {
      error
    } = await supabaseClient
      .from("sales")
      .update({
        amount:
          Number(amount) || 0
      })
      .eq("id", id)
      .eq("user_id", currentUser.id);

    if (error) {
      throw error;
    }

    setOnlineStatus(true);

  } catch (error) {

    console.error(error);

    setOnlineStatus(false);

    showToast(
      "Sync failed. Please check your connection."
    );

  }

}


/* =========================================================
   UPDATE SALE
========================================================= */

async function updateSale(
  id,
  amount
) {

  try {

    const {
      error
    } = await supabaseClient
      .from("sales")
      .update({
        amount:
          Number(amount) || 0
      })
      .eq("id", id)
      .eq("user_id", currentUser.id);

    if (error) {
      throw error;
    }

  } catch (error) {

    console.error(error);

  }

}


/* =========================================================
   DELETE SALE
========================================================= */

async function deleteSale(id) {

  const index =
    sales.findIndex(
      item => String(item.id) === String(id)
    );

  if (index === -1) return;

  const deleted =
    sales[index];

  /*
    Remove instantly from UI.
  */

  sales.splice(index, 1);

  renderSales();

  /*
    If this is still a temporary sale,
    nothing exists in database yet.
  */

  if (String(id).startsWith("temp-")) {

    showUndo(deleted, false);

    return;

  }

  try {

    const {
      error
    } = await supabaseClient
      .from("sales")
      .delete()
      .eq("id", id)
      .eq("user_id", currentUser.id);

    if (error) {
      throw error;
    }

    setOnlineStatus(true);

    showUndo(deleted, true);

  } catch (error) {

    console.error(error);

    /*
      Restore if delete failed.
    */

    sales.splice(
      index,
      0,
      deleted
    );

    renderSales();

    setOnlineStatus(false);

    showToast(
      "Delete failed."
    );

  }

}


/* =========================================================
   UNDO
========================================================= */

function showUndo(
  deletedSale,
  wasInDatabase
) {

  clearTimeout(undoTimer);

  undoData = {
    sale: deletedSale,
    wasInDatabase
  };

  undoText.textContent =
    `Deleted ${formatNumber(deletedSale.amount)}`;

  undoBar.classList.add("show");

  undoTimer =
    setTimeout(() => {

      undoData = null;

      undoBar.classList.remove(
        "show"
      );

    }, 7000);

}


undoBtn.addEventListener(
  "click",
  async () => {

    if (!undoData) return;

    clearTimeout(undoTimer);

    const data =
      undoData;

    undoData = null;

    undoBar.classList.remove(
      "show"
    );

    const sale =
      data.sale;

    /*
      Temporary sale:
      just restore locally.
    */

    if (!data.wasInDatabase) {

      sales.push(sale);

      renderSales();

      showToast(
        "Sale restored."
      );

      return;

    }

    /*
      Restore database record.
    */

    try {

      const {
        data: restored,
        error
      } = await supabaseClient
        .from("sales")
        .insert({
          id: sale.id,
          amount: sale.amount,
          created_at: sale.created_at,
          user_id: currentUser.id
        })
        .select()
        .single();

      if (error) {
        throw error;
      }

      sales.push(restored);

      sales.sort(
        (a, b) =>
          new Date(a.created_at) -
          new Date(b.created_at)
      );

      renderSales();

      setOnlineStatus(true);

      showToast(
        "Sale restored."
      );

    } catch (error) {

      console.error(error);

      showToast(
        "Could not restore sale."
      );

    }

  }
);


/* =========================================================
   RESET ALL
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    if (!sales.length) {

      showToast(
        "There are no sales to reset."
      );

      return;

    }

    /*
      FIRST confirmation
    */

    openConfirm(
      "Reset All Sales",
      "This will delete ALL your sales. Continue?",
      () => {

        /*
          SECOND confirmation
        */

        openConfirm(
          "Final Confirmation",
          "This action cannot be easily undone. Delete ALL sales?",
          () => resetAllSales()
        );

      }
    );

  }
);


/* =========================================================
   RESET DATABASE
========================================================= */

async function resetAllSales() {

  const oldSales =
    [...sales];

  sales = [];

  renderSales();

  try {

    const {
      error
    } = await supabaseClient
      .from("sales")
      .delete()
      .eq("user_id", currentUser.id);

    if (error) {
      throw error;
    }

    setOnlineStatus(true);

    showToast(
      "All sales have been deleted."
    );

  } catch (error) {

    console.error(error);

    sales =
      oldSales;

    renderSales();

    setOnlineStatus(false);

    showToast(
      "Reset failed. Your sales were restored."
    );

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard() {

  const count =
    sales.length;

  const total =
    sales.reduce(
      (sum, sale) =>
        sum + Number(sale.amount || 0),
      0
    );

  const todayTotal =
    sales.reduce(
      (sum, sale) => {

        if (
          isToday(
            sale.created_at
          )
        ) {

          return sum +
            Number(sale.amount || 0);

        }

        return sum;

      },
      0
    );

  countValue.textContent =
    count;

  totalValue.textContent =
    formatNumber(total);

  todayValue.textContent =
    formatNumber(todayTotal);

  salesCountText.textContent =
    `${count} ${count === 1 ? "entry" : "entries"}`;


  /*
    Last Sale
  */

  if (!sales.length) {

    lastSaleValue.textContent =
      "—";

  } else {

    const last =
      [...sales]
        .sort(
          (a, b) =>
            new Date(b.created_at) -
            new Date(a.created_at)
        )[0];

    lastSaleValue.textContent =
      formatNumber(last.amount);

  }

}


/* =========================================================
   TODAY CHECK
========================================================= */

function isToday(dateValue) {

  const date =
    new Date(dateValue);

  const now =
    new Date();

  return (
    date.getFullYear() ===
      now.getFullYear() &&

    date.getMonth() ===
      now.getMonth() &&

    date.getDate() ===
      now.getDate()
  );

}


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(value) {

  return Number(value || 0)
    .toLocaleString(
      undefined,
      {
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }
    );

}


/* =========================================================
   EXPORT CSV
========================================================= */

exportBtn.addEventListener(
  "click",
  () => {

    if (!sales.length) {

      showToast(
        "No sales to export."
      );

      return;

    }

    const headers = [
      "No",
      "Amount",
      "Date",
      "Time"
    ];

    const rows =
      sales.map(
        (sale, index) => {

          const date =
            new Date(
              sale.created_at
            );

          return [
            index + 1,
            Number(sale.amount || 0),
            date.toLocaleDateString(),
            date.toLocaleTimeString()
          ];

        }
      );

    const csv = [
      headers,
      ...rows
    ]
      .map(
        row =>
          row
            .map(csvEscape)
            .join(",")
      )
      .join("\n");

    const blob =
      new Blob(
        [csv],
        {
          type:
            "text/csv;charset=utf-8;"
        }
      );

    const url =
      URL.createObjectURL(blob);

    const link =
      document.createElement("a");

    const date =
      new Date()
        .toISOString()
        .slice(0, 10);

    link.href = url;

    link.download =
      `saletrack-sales-${date}.csv`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    showToast(
      "CSV exported successfully."
    );

  }
);


function csvEscape(value) {

  const string =
    String(value ?? "");

  if (
    string.includes(",") ||
    string.includes('"') ||
    string.includes("\n")
  ) {

    return `"${string.replace(
      /"/g,
      '""'
    )}"`;

  }

  return string;

}


/* =========================================================
   LOGOUT
========================================================= */

logoutBtn.addEventListener(
  "click",
  async () => {

    const confirmed =
      await askConfirmation(
        "Logout",
        "Are you sure you want to logout?"
      );

    if (!confirmed) return;

    await supabaseClient.auth.signOut();

    sales = [];

    currentUser = null;

    showLogin();

  }
);


/* =========================================================
   CONFIRM MODAL
========================================================= */

function openConfirm(
  title,
  message,
  action
) {

  modalTitle.textContent =
    title;

  modalMessage.textContent =
    message;

  modalAction =
    action;

  modalOverlay.classList.remove(
    "hidden"
  );

}


modalCancel.addEventListener(
  "click",
  () => {

    closeModal();

  }
);


modalConfirm.addEventListener(
  "click",
  () => {

    const action =
      modalAction;

    closeModal();

    if (typeof action === "function") {
      action();
    }

  }
);


function closeModal() {

  modalOverlay.classList.add(
    "hidden"
  );

  modalAction = null;

}


/*
  Promise confirmation for logout.
*/

function askConfirmation(
  title,
  message
) {

  return new Promise(
    resolve => {

      modalTitle.textContent =
        title;

      modalMessage.textContent =
        message;

      modalOverlay.classList.remove(
        "hidden"
      );

      const yesHandler = () => {

        cleanup();

        resolve(true);

      };

      const noHandler = () => {

        cleanup();

        resolve(false);

      };

      function cleanup() {

        modalOverlay.classList.add(
          "hidden"
        );

        modalConfirm.removeEventListener(
          "click",
          yesHandler
        );

        modalCancel.removeEventListener(
          "click",
          noHandler
        );

      }

      modalConfirm.addEventListener(
        "click",
        yesHandler
      );

      modalCancel.addEventListener(
        "click",
        noHandler
      );

    }
  );

}


/* =========================================================
   ONLINE / OFFLINE
========================================================= */

function setOnlineStatus(online) {

  if (online) {

    connectionStatus.classList.remove(
      "offline"
    );

    statusText.textContent =
      "Online";

  } else {

    connectionStatus.classList.add(
      "offline"
    );

    statusText.textContent =
      "Offline";

  }

}


window.addEventListener(
  "online",
  () => {

    setOnlineStatus(true);

    /*
      Automatically refresh when
      internet comes back.
    */

    if (currentUser) {
      loadSales();
    }

  }
);


window.addEventListener(
  "offline",
  () => {

    setOnlineStatus(false);

  }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message) {

  clearTimeout(toastTimer);

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  toastTimer =
    setTimeout(() => {

      toast.classList.remove(
        "show"
      );

    }, 2500);

}


/* =========================================================
   INITIALIZE
========================================================= */

setOnlineStatus(
  navigator.onLine
);

checkAuth();

</script>
